<div class="bg-[#FDF9F6] rounded-xl shadow-sm border border-[#D5C2B3] p-6 h-full flex flex-col">
  <div class="flex items-center space-x-3 mb-6">
    <div class="bg-brand-background p-2.5 rounded-lg border border-[#D5C2B3]">
      <svg class="w-6 h-6 text-brand-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
    </div>
    <div>
      <h2 class="text-lg font-bold text-brand-primary font-inter-tight">Dados do Veículo</h2>
      <p class="text-xs text-brand-muted">Informações cadastradas</p>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 gap-y-6 gap-x-4">
    <div class="flex flex-col">
      <span class="text-xs font-semibold text-brand-muted uppercase tracking-wider mb-1">Placa</span>
      <span class="text-base font-bold text-brand-primary uppercase bg-[#F5ECE5] px-2 py-1 rounded-md w-fit border border-[#D5C2B3]">{{ veiculo.placa }}</span>
    </div>

    <div class="flex flex-col">
      <span class="text-xs font-semibold text-brand-muted uppercase tracking-wider mb-1">Marca</span>
      <span class="text-sm font-medium text-brand-text">{{ veiculo.marca }}</span>
    </div>

    <div class="flex flex-col">
      <span class="text-xs font-semibold text-brand-muted uppercase tracking-wider mb-1">Modelo</span>
      <span class="text-sm font-medium text-brand-text">{{ veiculo.modelo }}</span>
    </div>

    <div class="flex flex-col">
      <span class="text-xs font-semibold text-brand-muted uppercase tracking-wider mb-1">Cor</span>
      <span class="text-sm font-medium text-brand-text">{{ veiculo.cor }}</span>
    </div>

    <div class="flex flex-col">
      <span class="text-xs font-semibold text-brand-muted uppercase tracking-wider mb-1">Ano</span>
      <span class="text-sm font-medium text-brand-text">{{ veiculo.ano }}</span>
    </div>

    <div class="flex flex-col">
      <span class="text-xs font-semibold text-brand-muted uppercase tracking-wider mb-1">KM</span>
      <span class="text-sm font-medium text-brand-text">{{ veiculo.km | number }} km</span>
    </div>
  </div>
</div>
