<div class="bg-brand-background rounded-xl shadow-sm border border-brand-input p-4 mb-4 md:hidden group active:border-brand-accent transition-colors">
  <div class="flex justify-between items-start mb-2">
    <div>
      <h3 class="text-base font-bold text-brand-primary uppercase tracking-tight">{{ veiculo.placa }}</h3>
      <p class="text-sm text-brand-muted mt-0.5">{{ veiculo.modelo }}</p>
    </div>
    <div class="p-1.5 text-brand-muted">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6"/>
      </svg>
    </div>
  </div>
  
  <div class="mt-3 pt-3 border-t border-brand-input flex justify-between items-center">
    <div class="flex flex-col">
      <span class="text-[10px] font-bold text-brand-muted uppercase tracking-wider">Ano • Cor</span>
      <span class="text-sm font-semibold text-brand-primary">{{ veiculo.ano }} • {{ veiculo.cor }}</span>
    </div>
    <app-status-badge [status]="veiculo.status"></app-status-badge>
  </div>
</div>
