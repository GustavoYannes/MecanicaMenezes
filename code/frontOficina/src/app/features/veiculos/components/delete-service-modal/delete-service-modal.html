<div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
  <!-- Overlay Backdrop com Blur -->
  <div class="absolute inset-0 bg-brand-primary/40 backdrop-blur-sm transition-opacity" (click)="!isSubmitting ? cancel.emit() : null"></div>

  <!-- Modal Card -->
  <div class="relative w-full max-w-lg bg-[#EBDFD7] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden max-h-[90vh]">
    
    @if (isSuccess) {
      <div class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#F5ECE5] rounded-[2rem] animate-in fade-in zoom-in duration-300">
        <div class="bg-green-100 text-green-500 p-5 rounded-full mb-4 shadow-sm scale-110">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-brand-primary font-inter-tight">Excluído com sucesso!</h3>
      </div>
    }

    <!-- Header -->
    <div class="flex items-center justify-between px-8 py-6 border-b border-[#D5C2B3]">
      <div class="flex items-center space-x-3 text-red-600">
        <div class="bg-red-100 p-2.5 rounded-full">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </div>
        <h2 class="text-2xl font-extrabold text-brand-primary font-inter-tight">Excluir Serviço</h2>
      </div>
      <button 
        (click)="cancel.emit()"
        [disabled]="isSubmitting"
        class="text-brand-muted hover:text-brand-primary p-2 hover:bg-black/5 rounded-full transition-colors focus:outline-none disabled:opacity-50 cursor-pointer disabled:cursor-not-allowed"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-8 py-6 bg-[#F5ECE5]">
      <p class="text-brand-primary text-lg font-medium text-center mb-2">
        Tem certeza que deseja excluir este serviço?
      </p>
      
      @if (servico) {
        <div class="p-4 rounded-xl border border-[#D5C2B3] text-center shadow-sm">
          <p class="text-sm font-bold text-brand-primary uppercase tracking-wide">{{ servico.nome }}</p>
          <p class="text-xs text-brand-muted mt-1">{{ servico.quantidade }}x R$ {{ servico.valor }}</p>
        </div>
      }
      
      <p class="text-brand-muted text-sm text-center mt-4">
        Esta ação não poderá ser desfeita e o valor será removido do total do orçamento.
      </p>
    </div>

    <!-- Footer Actions -->
    <div class="px-8 py-5 bg-[#EBE0D8] border-t border-[#D5C2B3] flex justify-between items-center rounded-b-[2rem]">
      <button 
        type="button" 
        (click)="cancel.emit()"
        [disabled]="isSubmitting"
        class="px-6 py-2.5 text-sm font-bold text-brand-primary hover:bg-black/5 rounded-xl transition-colors focus:outline-none disabled:opacity-50 cursor-pointer disabled:cursor-not-allowed"
      >
        Cancelar
      </button>
      
      <button 
        type="button" 
        (click)="confirm.emit()"
        [disabled]="isSubmitting"
        class="px-6 py-2.5 text-sm font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-md transition-all active:scale-95 focus:outline-none focus:ring-4 focus:ring-red-600/20 flex items-center space-x-2 disabled:opacity-70 disabled:active:scale-100 cursor-pointer disabled:cursor-not-allowed"
      >
        @if (isSubmitting) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Excluindo...</span>
        } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          <span>Confirmar Exclusão</span>
        }
      </button>
    </div>

  </div>
</div>
