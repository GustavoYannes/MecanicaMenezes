<div class="flex flex-col space-y-6">
  
  <div class="space-y-2">
    <label class="text-sm font-semibold text-brand-text">Cliente Existente</label>
    <app-client-cpf-search (clienteSelected)="onClienteSelected($event)"></app-client-cpf-search>
    
    @if (loadingDetails()) {
      <div class="text-xs text-brand-accent flex items-center mt-1">
        <svg class="animate-spin -ml-1 mr-2 h-3 w-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Carregando detalhes...
      </div>
    }
    @if (errorDetails()) {
      <div class="text-xs text-red-500 mt-1">{{ errorDetails() }}</div>
    }
  </div>

  <div class="relative flex py-2 items-center">
    <div class="flex-grow border-t border-brand-input"></div>
    <span class="flex-shrink-0 mx-4 text-brand-muted text-xs font-semibold uppercase tracking-wider">OU CRIE UM NOVO CLIENTE</span>
    <div class="flex-grow border-t border-brand-input"></div>
  </div>

  <form [formGroup]="clientForm" class="space-y-5">
    <!-- Nome -->
    <div class="flex flex-col space-y-1.5">
      <label class="text-sm font-semibold text-brand-text">Nome Completo</label>
      <input type="text" formControlName="nomeCompleto" placeholder="Ex: Roberto Carlos da Silva" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-3 px-4 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all">
    </div>

    <!-- CPF and Phone Row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="flex flex-col space-y-1.5">
        <label class="text-sm font-semibold text-brand-text">CPF</label>
        <input type="text" formControlName="cpf" mask="000.000.000-00" placeholder="000.000.000-00" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-3 px-4 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all">
      </div>
      <div class="flex flex-col space-y-1.5">
        <label class="text-sm font-semibold text-brand-text">Telefone</label>
        <input type="text" formControlName="telefone" mask="(00) 00000-0000" placeholder="(00) 00000-0000" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-3 px-4 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all">
      </div>
    </div>

    <!-- Email -->
    <div class="flex flex-col space-y-1.5">
      <label class="text-sm font-semibold text-brand-text">Email</label>
      <input type="email" formControlName="email" placeholder="email@exemplo.com" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-3 px-4 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all">
    </div>

    <!-- Endereço Section -->
    <div formGroupName="endereco" class="space-y-4 pt-2">
      <h3 class="text-sm font-semibold text-brand-text border-b border-brand-input pb-2">Endereço</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col space-y-1.5">
          <label class="text-xs font-semibold text-brand-muted">CEP</label>
          <input type="text" formControlName="cep" mask="00000-000" placeholder="00000-000" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-2.5 px-3 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div class="flex flex-col space-y-1.5 md:col-span-2">
          <label class="text-xs font-semibold text-brand-muted">Rua</label>
          <input type="text" formControlName="rua" placeholder="Rua das Flores" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-2.5 px-3 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex flex-col space-y-1.5">
          <label class="text-xs font-semibold text-brand-muted">Número</label>
          <input type="text" formControlName="numero" placeholder="123" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-2.5 px-3 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div class="flex flex-col space-y-1.5">
          <label class="text-xs font-semibold text-brand-muted">Bairro</label>
          <input type="text" formControlName="bairro" placeholder="Centro" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-2.5 px-3 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
        </div>
        <div class="flex flex-col space-y-1.5">
          <label class="text-xs font-semibold text-brand-muted">Cidade/UF</label>
          <div class="flex space-x-2">
            <input type="text" formControlName="cidade" placeholder="Cidade" class="w-full bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-2.5 px-3 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm">
            <input type="text" formControlName="estado" placeholder="UF" maxlength="2" class="w-16 bg-[#F5ECE5] text-brand-text placeholder-brand-muted rounded-xl py-2.5 px-2 border border-brand-input focus:outline-none focus:ring-2 focus:ring-brand-accent transition-all text-sm uppercase text-center">
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
