<div class="relative max-w-md w-full">
  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
    <svg class="h-5 w-5 text-brand-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
  </div>
  <input 
    type="text" 
    [formControl]="searchControl"
    class="block w-full pl-10 pr-10 py-2 border border-[#D5C2B3] rounded-xl leading-5 bg-[#F5ECE5] text-brand-primary placeholder-brand-muted focus:outline-none focus:ring-2 focus:ring-brand-accent focus:border-brand-accent sm:text-sm transition-colors shadow-sm" 
    [placeholder]="placeholder">
  
  @if (searchControl.value) {
    <button 
      (click)="clearSearch()"
      class="absolute inset-y-0 right-0 pr-3 flex items-center text-brand-muted hover:text-brand-accent focus:outline-none"
    >
      <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  }
</div>
