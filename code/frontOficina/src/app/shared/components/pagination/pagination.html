<div class="flex items-center justify-between px-6 py-4 bg-transparent border-t border-[#D5C2B3]/50 sm:px-6">
  <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
    <div>
      <p class="text-sm text-brand-muted">
        Mostrando {{ totalElements > 0 ? (currentPage * 5) + 1 : 0 }} a {{ last ? totalElements : (currentPage + 1) * 5 }} de {{ totalElements }} {{ itemName }}
      </p>
    </div>
    <div>
      <nav class="relative z-0 inline-flex items-center space-x-2" aria-label="Pagination">
        <!-- Previous button -->
        <button 
          (click)="previous()"
          [disabled]="first"
          class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg bg-[#EBE0D8] text-brand-primary hover:bg-[#D5C2B3] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          <span class="sr-only">Anterior</span>
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
        
        <!-- Page numbers -->
        @for (page of pages; track page) {
          <button 
            (click)="goToPage(page)"
            [class.bg-black]="page === currentPage"
            [class.text-white]="page === currentPage"
            [class.bg-[#EBE0D8]]="page !== currentPage"
            [class.text-brand-primary]="page !== currentPage"
            class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg text-sm font-semibold hover:bg-opacity-80 transition-colors">
            {{ page + 1 }}
          </button>
        }

        <!-- Next button -->
        <button 
          (click)="next()"
          [disabled]="last"
          class="relative inline-flex items-center justify-center w-8 h-8 rounded-lg bg-[#EBE0D8] text-brand-primary hover:bg-[#D5C2B3] disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          <span class="sr-only">Próximo</span>
          <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
      </nav>
    </div>
  </div>
</div>
